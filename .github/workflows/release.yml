name: Release

# Builds installers for every supported platform and publishes them as a
# GitHub release. Runs when a tag like v1.2.3 or beta0.0.0 is pushed, or
# manually with a tag name (the tag is created on the selected ref).
on:
  push:
    tags:
      - "v*"
      - "beta*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. beta0.0.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-windows
            runs-on: ubuntu-latest
            targets: "linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64"
          - name: macos
            runs-on: macos-latest
            targets: "darwin/arm64 darwin/amd64"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Compute package version
        id: ver
        shell: bash
        run: |
          # Debian/macOS versions must start with a digit: beta0.0.0 -> 0.0.0~beta, v1.2.3 -> 1.2.3
          V="${TAG#v}"
          if [[ "$V" =~ ^([a-zA-Z]+)([0-9].*)$ ]]; then V="${BASH_REMATCH[2]}~${BASH_REMATCH[1]}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build installers
        shell: bash
        env:
          SKIP_FRONTEND: "1"
          TARGETS: ${{ matrix.targets }}
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist
          cp build/*.dmg build/*.zip build/*.deb dist/ 2>/dev/null || true
          # Plain Linux binaries for non-Debian distros
          for a in amd64 arm64 arm; do
            [ -f "build/linux_${a}/scoreboard" ] && tar -C "build/linux_${a}" -czf "dist/scoreboard_linux_${a}.tar.gz" scoreboard
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(env.TAG, 'beta') || contains(env.TAG, '-') }}
          generate_release_notes: true
          files: dist/*
